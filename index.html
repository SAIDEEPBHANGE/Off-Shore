<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DLL Explorer</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
    <style>
      body {
        background: #000000;
        color: #111827;
      }

      #graph {
        background: #000000;
      }

      #graphLoader {
        backdrop-filter: blur(2px);
      }
    </style>
  </head>
  <body class="bg-slate-100 h-screen overflow-hidden">
    <header class="bg-slate-900 text-white px-6 py-4 shadow">
      <div class="flex items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold">DLL Explorer</h1>
          <p class="text-sm text-slate-300">
            Assembly Browser • Dependency Viewer • Code Explorer
          </p>
        </div>

        <div class="flex items-center gap-2">
          <label for="structureSelect" class="text-sm text-slate-300">
            Structure
          </label>
          <select
            id="structureSelect"
            class="rounded-lg border border-slate-600 bg-slate-800 px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
          ></select>
        </div>
      </div>
    </header>

    <main class="flex h-[calc(100vh-88px)]">
      <section class="w-2/3 border-r border-slate-800 bg-black">
        <div class="border-b border-slate-800 bg-slate-950 p-3">
          <h2 class="font-semibold text-white">Dependency Graph</h2>
          <p id="graphStatus" class="text-sm text-slate-400">
            Loading structure...
          </p>
        </div>

        <div class="relative h-[calc(100%-64px)] w-full">
          <div id="graph" class="h-full w-full"></div>
          <div
            id="graphLoader"
            class="absolute inset-0 hidden items-center justify-center bg-black/85"
          >
            <div
              class="rounded-lg border border-white/20 bg-white/10 px-4 py-3 text-white shadow-lg"
            >
              <div class="flex items-center gap-3">
                <div
                  class="h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"
                ></div>
                <span id="graphLoaderText">Loading structure...</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <aside class="w-1/3 bg-slate-50">
        <div class="border-b bg-white p-3">
          <h2 class="font-semibold">Details</h2>
        </div>

        <div id="detailsPanel" class="h-[calc(100%-48px)] overflow-auto p-4">
          <div class="text-slate-500">
            Select a DLL or dependency to view its information.
          </div>
        </div>
      </aside>
    </main>

    <script src="js/graph.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
